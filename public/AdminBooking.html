<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pending Bookings</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <h1 style="text-align: center;">Manage Booking Requests</h1>

  <main>
    <table>
      <caption>Pending Bookings</caption>
      <thead>
        <tr>
          <th>Booking ID</th>
          <th>Facility</th>
          <th>Start Time</th>
          <th>End Time</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="booking-table-body">
        <!-- Rows will be filled by API -->
      </tbody>
    </table>
  </main>

  <script>
    const API_URL = 'https://csmf-ayf7egbaedhug4g6.southafricanorth-01.azurewebsites.net/api/booking';

    fetch(API_URL)
      .then(response => response.json())
      .then(bookings => {
        const tbody = document.getElementById('booking-table-body');
        tbody.innerHTML = '';

        bookings.forEach(booking => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${booking.booking_id}</td>
            <td>Facility ${booking.facility_id}</td>
            <td>${booking.start_time.split('T')[0]}</td>
            <td>${booking.end_time.split('T')[0]}</td>
            <td id="status-${booking.booking_id}">${booking.status}</td>
            <td id="action-${booking.booking_id}">
              <button class="accept" onclick="updateBooking(${booking.booking_id}, 'approved')">Accept</button>
              <button class="decline" onclick="updateBooking(${booking.booking_id}, 'blocked')">Decline</button>
            </td>
          `;
          tbody.appendChild(row);
        });
      })
      .catch(error => {
        console.error('Error loading bookings:', error);
      });

    function updateBooking(bookingId, newStatus) {
      fetch(`${API_URL}/${bookingId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      })
      .then(res => {
        if (!res.ok) throw new Error('Failed to update booking');
        return res.json();
      })
      .then(updated => {
        document.getElementById(`status-${bookingId}`).innerText = updated.status;
        const actionCell = document.getElementById(`action-${bookingId}`);
        actionCell.innerHTML = `
          <button onclick="editBooking(${bookingId})" class="edit">Edit</button>
        `;
        alert(`Booking #${updated.booking_id} updated to ${updated.status}`);
      })
      .catch(err => {
        console.error(err);
        alert('Something went wrong updating the booking');
      });
    }

    function editBooking(bookingId) {
      const actionCell = document.getElementById(`action-${bookingId}`);
      actionCell.innerHTML = `
        <button class="accept" onclick="updateBooking(${bookingId}, 'approved')">Accept</button>
        <button class="decline" onclick="updateBooking(${bookingId}, 'blocked')">Decline</button>
      `;
    }
  </script>
</body>
</html>

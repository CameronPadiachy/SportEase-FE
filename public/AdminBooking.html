          <th>Booking ID</th>
          <th>Facility</th>
          <th>Start Time</th>
          <th>End Time</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="booking-table-body">
     
        <tr>
          <td>101</td>
          <td>Soccer Field A</td>
          <td>2025-04-18 10:00</td>
          <td>2025-04-18 11:00</td>
          <td>pending</td>
          <td id="action-101">
            <button class="accept" onclick="updateBooking(101, 'approved')">Accept</button>
            <button class="decline" onclick="updateBooking(101, 'blocked')">Decline</button>
          </td>
        </tr>
      </tbody>
    </table>
  </main>

    function updateBooking(bookingId, newStatus) {
      const actionCell = document.getElementById(`action-${bookingId}`);
      actionCell.innerHTML = `
        <button onclick="editBooking(${bookingId})" class="edit">Edit</button>
      `;
      alert(`Booking #${bookingId} marked as ${newStatus}`);
    }

    function editBooking(bookingId) {
      const actionCell = document.getElementById(`action-${bookingId}`);
      actionCell.innerHTML = `
        <button class="accept" onclick="updateBooking(${bookingId}, 'approved')">Accept</button>
        <button class="decline" onclick="updateBooking(${bookingId}, 'blocked')">Decline</button>
      `;
    }
  </script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pending Bookings</title>
  <link rel="stylesheet" href="Admin1.css">
</head>

<body class="admin-page">
  <!-- Admin Dashboard Header -->
  <header class="admin-header">
    <h1 class="admin-title">Manage Booking Requests</h1>
    <p class="admin-subtitle">You can manage booking requests being made by users.</p>
  </header>

  <main>
    <table>
      <caption>Pending Bookings</caption>
      <thead>
        <tr>
          <th>Booking ID</th>
          <th>Facility</th>
          <th>Start Time</th>
          <th>End Time</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="booking-table-body"></tbody>
    </table>
  </main>

  <script>
    const API_URL = 'https://sporteasebe-hka9fng7gaaue7c2.canadacentral-01.azurewebsites.net/api/booking';

    fetch(API_URL)
      .then(response => response.json())
      .then(bookings => {
        const tbody = document.getElementById('booking-table-body');
        tbody.innerHTML = '';

        const pendingBookings = bookings.filter(b => b.status === null);

        pendingBookings.forEach(booking => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${booking.booking_id}</td>
            <td>Facility ${booking.facility_id}</td>
            <td>${booking.start_time.split('T')[0]}</td>
            <td>${booking.end_time.split('T')[0]}</td>
            <td id="status-${booking.booking_id}">pending</td>
            <td id="action-${booking.booking_id}">
              <button class="accept" onclick="updateBooking(${booking.booking_id}, 'approved')">Accept</button>
              <button class="decline" onclick="updateBooking(${booking.booking_id}, 'rejected')">Decline</button>
            </td>
          `;
          tbody.appendChild(row);
        });
      })
      .catch(error => {
        console.error('Error loading bookings:', error);
      });

    function updateBooking(bookingId, newStatus) {
      const endpoint = newStatus === 'approved'
        ? `${API_URL}/approve/${bookingId}`
        : `${API_URL}/reject/${bookingId}`;

      fetch(endpoint, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' }
      })
      .then(res => {
        if (!res.ok) throw new Error('Failed to update booking');
        return res.json();
      })
      .then(() => {
        document.getElementById(`status-${bookingId}`).innerText = newStatus;
        const actionCell = document.getElementById(`action-${bookingId}`);
        actionCell.innerHTML = `
          <button onclick="editBooking(${bookingId})" class="edit">Edit</button>
        `;
        alert(`Booking #${bookingId} updated to ${newStatus} and notification sent`);
      })
      .catch(err => {
        console.error(err);
        alert('Something went wrong updating the booking');
      });
    }

    function editBooking(bookingId) {
      const actionCell = document.getElementById(`action-${bookingId}`);
      actionCell.innerHTML = `
        <button class="accept" onclick="updateBooking(${bookingId}, 'approved')">Accept</button>
        <button class="decline" onclick="updateBooking(${bookingId}, 'rejected')">Decline</button>
      `;
    }
  </script>
</body>
</html>

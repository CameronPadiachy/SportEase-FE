<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SportEase Home</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e8f0fe;
      text-align: center;
      padding-top: 100px;
    }

    h1 {
      color: #2c3e50;
      font-size: 36px;
    }

    #username {
      font-size: 24px;
      margin-top: 10px;
    }

    #profile {
      margin-top: 20px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 2px solid #ccc;
    }

    .btn {
      margin-top: 30px;
      padding: 12px 24px;
      font-size: 16px;
      background-color: #ff5252;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #e53935;
    }
  </style>
</head>
<body>
  <h1>Logged in as</h1>
  <h2 id="username">Loading...</h2>
  <img id="profile" src="" alt="User Profile Picture" />
  <br><br>
  <button class="btn" id="logoutBtn">Log Out</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBKdZ1JUbVHMaRuVfqPUYTYmcphjDRfvvM",
      authDomain: "community-sports-199ef.firebaseapp.com",
      projectId: "community-sports-199ef",
      storageBucket: "community-sports-199ef.firebasestorage.app",
      messagingSenderId: "262525665971",
      appId: "1:262525665971:web:69034d81b07b0792b3a6c6",
      measurementId: "G-Q1Z2BBQQT7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        document.getElementById("username").innerText = user.displayName;
        document.getElementById("profile").src = user.photoURL;

        const userRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(userRef);

        if (docSnap.exists()) {
          const role = docSnap.data().role;
          console.log("User role:", role);
        } else {
          console.warn("User doc not found in Firestore.");
        }
      } else {
        window.location.href = "index.html";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      signOut(auth).then(() => {
        window.location.href = "index.html";
      });
    });
  </script>
</body>
</html>

name: Test Coverage

on: [push, pull_request]  # Runs on every push/PR

jobs:
  coverage:
    runs-on: ubuntu-latest  # Uses a Linux machine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Downloads your code

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18  # Matches your React version

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm run coverage  # Uses your package.json script

      - name: Upload to Codecov
        run: npm run upload-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}  # Securely uses your token
